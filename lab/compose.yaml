name: xkeen-router-lab
services:
  router:
    image: xkeen-router-lab:dev
    build: .
    init: true
    cap_add: [NET_ADMIN]
    command: ["${LAB_RUNTIME:-xkeen}"]
    volumes:
      - router-config:/opt/etc/xray/configs
    healthcheck:
      test: [CMD, /opt/sbin/xray, api, statsquery, --server=127.0.0.1:10085]
      interval: 5s
      timeout: 3s
      retries: 6
  xkeen-probe:
    image: xkeen-router-lab:dev
    profiles: [probe]
    init: true
    cap_add: [NET_ADMIN]
    command: [xkeen-probe]
volumes:
  router-config:
