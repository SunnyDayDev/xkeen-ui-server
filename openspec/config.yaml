schema: spec-driven

context: |
  Общие инструкции проекта находятся в AGENTS.md.
  Согласованные требования DDD, Clean Architecture, SOLID и TDD/BDD и их применение
  описаны в docs/architecture.md, раздел «Принципы разработки».
  Порядок работы над UI описан в docs/design.md; изменения интерфейса
  сначала отражаются в design/xkeen-ui-server-design.pen через MCP Pencil.
  Учитывай эти документы при подготовке артефактов; статус открытых решений
  проверяй по актуальной документации и артефактам изменения.

rules:
  proposal:
    - Для изменений только процессов или инструментов разработки без изменения продуктового поведения используй skip_specs в метаданных change; не создавай процессную capability.
  specs:
    - Описывай только наблюдаемое поведение сервиса, его результаты, ошибки и продуктовые инварианты. TDD/BDD, DDD, Clean Architecture, SOLID и CI относятся к правилам и отдельной документации, а их применение — к design и tasks.
    - До реализации опиши наблюдаемые сценарии, входы, ожидаемые результаты, ошибки и применимые граничные случаи; используй их как основу тестов.
  design:
    - Опиши применимые к изменению границы модулей, направление зависимостей и владельцев доменных инвариантов согласно docs/architecture.md.
    - Определи контракты затронутых интерфейсов и способ их проверки до реализации логики.
    - Если изменение затрагивает UI, укажи связанные экраны и состояния макета согласно docs/design.md.
  tasks:
    - Включи целевые проверки затронутых доменных правил и инфраструктурных адаптеров согласно архитектурным решениям изменения.
    - Для каждого небольшого сценария поведения явно задай порядок TDD/BDD — тест по спецификации, запуск и подтверждение Red, минимальная реализация для Green, рефакторинг и повторная проверка. Предусмотри запись фактических результатов проверок.
    - Для задач UI поставь обновление и проверку макета через MCP Pencil перед тестами и реализацией интерфейса; после реализации предусмотрите визуальную сверку с макетом согласно docs/design.md.
